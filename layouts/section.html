{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}
<ul class="staff-card-list">
    {{- range .Pages }}
    <li class="staff-card">
        <a href="{{ .RelPermalink }}">
            <h2>{{- .Title -}}</h2>
            {{ partial "headshot.html" . }}
            {{ partial "studios_text.html" . }}
        </a>
    </li>
    {{- end }}
</ul>
{{ end }}

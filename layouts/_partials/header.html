<a href="{{ .Site.BaseURL }}">
  {{- partial "logo.html" (dict "height" "64px" "fill" "rgb(170, 50, 38)") }}
</a>
<button id="nav-button">
  <svg xmlns="http://www.w3.org/2000/svg" height="32px" width="32px" viewBox="0 -960 960 960" fill="rgb(72, 48, 54)">
    <path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z" />
  </svg>
</button>
<nav id="nav-menu" class="inactive">
  <ul>
    {{- range .Site.Home.Pages }}
    <li>
      <a href="{{ .RelPermalink }}" {{ if $.Eq . }} aria-current="page" {{ end }}>
        {{- .Title -}}
      </a>
    </li>
    {{- end }}
  </ul>
</nav>

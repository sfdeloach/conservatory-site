<a href="{{ .Site.BaseURL }}">
  {{- partial "arch.html" (dict "context" . "height" "60px") }}
</a>
<button>
  <svg xmlns="http://www.w3.org/2000/svg" height="24px" width="24px" viewBox="0 -960 960 960" fill="#1f1f1f">
    <path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z" />
  </svg>
</button>
<nav>
  <ul>
    {{- range .Site.Home.Pages }}
    <li>
      <a href="{{ .RelPermalink }}" {{ if $.Eq . }} aria-current="page" {{ end }}>
        {{- .Title -}}
      </a>
    </li>
    {{- end }}
  </ul>
</nav>

<li class="staff-card">
  <a href="{{- .RelPermalink -}}">
    {{ partial "responsive_image.html"
      (dict
      "context" .
      "resource" "instrument.*"
      "sizes" "320px"
      "aspectRatio" 1.0
      "widths" (slice 320 640)
      "cssClass" "studioshot"
      "cropAnchor" "Center"
      "isLazyLoaded" true
      )
    }}
    <h2>{{- .LinkTitle -}}</h2>
  </a>
  {{- partial "studios_text.html" . -}}
</li>

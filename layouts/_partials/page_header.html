<div class="page-header">
  {{ with .Params.image }}
    {{ partial "responsive_image.html"
      (dict
      "context" $
      "resource" .
      "sizes" "100vw"
      "widths" (slice 640 960 1280 1920 2400)
      "cssClass" "page-header-image"
      "altText" ""
      "hasFetchPriority" true
      )
    }}
  {{ end }}
  <h1>{{ .Title }}</h1>
</div>

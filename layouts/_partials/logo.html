    xmlns="http://www.w3.org/2000/svg"
    height="{{- .height -}}"
    viewBox="0 0 50 100"
  >
    <path
      fill="currentColor"
      fill-rule="evenodd"
      d="M 0 0 H 50 V 100 H 0 Z M 5 40 V 95 H 45 V 40 A 50 50 0 0 0 25 5 A 50 50 0 0 0 5 40 Z"
    />

  <div class="logo-text">

    <p class="logo-text__bottom">Conservatory of Music</p>
  </div>
</div>

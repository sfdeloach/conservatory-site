{{- define "main" -}}
  {{ partial "page_header.html" . }}
  {{- .Content -}}
  <ul class="card-list">
    {{- range .Pages -}}
      {{ partial "card"
        (dict
        "context" .
        "listClass" "staff-card"
        "imageResource" "headshot.*"
        "imageClass" "headshot"
        "cropAnchor" "Top"
        )
      }}
    {{- end -}}
  </ul>
{{- end -}}

{{- define "main" -}}
  {{ partial "page_header.html" . }}
  {{- .Content -}}
  <ul class="card-list">
    {{- range partial "faculty_sort.html" .Pages -}}
      {{ partial "card.html"
        (dict
        "context" .
        "listClass" "card"
        "imageResource" "headshot.*"
        "imageClass" "card-image"
        "cropAnchor" "Top"
        )
      }}
    {{- end -}}
  </ul>
{{- end -}}

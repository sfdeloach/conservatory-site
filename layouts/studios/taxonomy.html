{{- define "main" }}
  {{ partial "page_header.html" . }}
  {{ partial "prose.html" . }}
  <ul class="card-list">
    {{- range .Pages -}}
      {{ partial "card.html"
        (dict
        "context" .
        "listClass" "card"
        "imageResource" .Params.image
        "imageClass" "card-image"
        "cropAnchor" "Center"
        )
      }}
    {{- end -}}
  </ul>
{{ end -}}

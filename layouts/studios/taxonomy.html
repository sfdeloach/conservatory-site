{{- define "main" }}
  {{ partial "page_header.html" . }}
  {{- .Content -}}
  <h2>{{ .Params.cardHeading }}</h2>
  <ul class="card-list">
    {{- range .Pages -}}
      {{ partial "card"
        (dict
        "context" .
        "listClass" "studio-card"
        "imageResource" "instrument.*"
        "imageClass" "studioshot"
        "cropAnchor" "Center"
        )
      }}
    {{- end -}}
  </ul>
{{ end -}}

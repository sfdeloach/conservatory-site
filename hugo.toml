baseURL = 'https://saintandrewsconservatory.org/'
locale = 'en-us'
title = 'Saint Andrew’s Conservatory of Music'
# Page dates (.Lastmod) come from Git. CI checks out full history for this.
enableGitInfo = true
# Writes public/robots.txt from layouts/robots.txt.
enableRobotsTXT = true

[params]
# The live domain's host. Every other host (the GitHub Pages staging copy,
# a local build) gets a noindex tag; see layouts/_partials/head_meta.html.
productionHost = "saintandrewsconservatory.org"

  [params.contact]
  address = "5525 Wayside Drive"
  cityStZip = "Sanford, Florida 32771"
  phoneHref = "+14073281139"
  phoneFormat = "(407) 328-1139"
  email = "mconservatory@sachapel.com"

[module]
  [module.hugoVersion]
  extended = true
  min = "0.168.0"

[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

[markup.goldmark.parser.attribute]
  block = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[markup.highlight]
  codeFences = false

[taxonomies]
  studio = "studios"

[[cascade]]
  [cascade.build]
    publishResources = false
